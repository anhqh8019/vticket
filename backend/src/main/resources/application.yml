spring:
  mvc:
    async:
      request-timeout: 300000
  application:
    name: vticket
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=vticket;encrypt=true;trustServerCertificate=false}
    username: ${DB_USERNAME:vticket}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/sqlserver
server:
  port: 8080
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  admin-user: ${ADMIN_USER:admin}
  admin-password: ${ADMIN_PASSWORD:}
  staff-user: ${STAFF_USER:staff}
  staff-password: ${STAFF_PASSWORD:}
  seed-data: false
  smile:
    enabled: ${SMILE_ENABLED:false}
    jdbc-url: ${SMILE_DB_URL:}
    username: ${SMILE_DB_USERNAME:}
    password: ${SMILE_DB_PASSWORD:}
    schema: ${SMILE_SCHEMA:dbo}
    table: ${SMILE_TABLE:TicketOnsen}
    clerk-id: ${SMILE_CLERK_ID:}
    code-mapping: ${SMILE_CODE_MAPPING:FIELD_NAMES}
    worker-enabled: ${SMILE_WORKER_ENABLED:true}
  vietqr:
    enabled: ${VIETQR_ENABLED:false}
    client:
      base-url: ${VIETQR_API_BASE_URL:https://dev.vietqr.org}
      username: ${VIETQR_API_USERNAME:}
      password: ${VIETQR_API_PASSWORD:}
    bank:
      code: ${VIETQR_BANK_CODE:MB}
      account: ${VIETQR_BANK_ACCOUNT:}
      account-name: ${VIETQR_BANK_ACCOUNT_NAME:}
    callback:
      username: ${VIETQR_CALLBACK_USERNAME:}
      password: ${VIETQR_CALLBACK_PASSWORD:}
      jwt-secret: ${VIETQR_CALLBACK_JWT_SECRET:}
      token-expiration-seconds: ${VIETQR_CALLBACK_TOKEN_EXPIRATION_SECONDS:300}
