spring:
  application:
    name: vticket
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=vticket;encrypt=true;trustServerCertificate=false}
    username: ${DB_USERNAME:vticket}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/sqlserver
server:
  port: 8080
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  admin-user: ${ADMIN_USER:admin}
  admin-password: ${ADMIN_PASSWORD:}
  staff-user: ${STAFF_USER:staff}
  staff-password: ${STAFF_PASSWORD:}
  demo-payment: false
  seed-data: false
