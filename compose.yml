services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      [
        '/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF DB_ID(N''vticket'') IS NULL CREATE DATABASE vticket"',
      ]
  backend:
    build: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=vticket;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: sa
      DB_PASSWORD: ${SQLSERVER_SA_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?Set STAFF_PASSWORD in .env}
      APP_SEED_DATA: ${APP_SEED_DATA:-false}
      SMILE_ENABLED: ${SMILE_ENABLED:-false}
      SMILE_DB_URL: ${SMILE_DB_URL:-}
      SMILE_DB_USERNAME: ${SMILE_DB_USERNAME:-}
      SMILE_DB_PASSWORD: ${SMILE_DB_PASSWORD:-}
      SMILE_SCHEMA: ${SMILE_SCHEMA:-dbo}
      SMILE_TABLE: ${SMILE_TABLE:-TicketOnsen}
      SMILE_CLERK_ID: ${SMILE_CLERK_ID:-}
      SMILE_CODE_MAPPING: ${SMILE_CODE_MAPPING:-FIELD_NAMES}
      SMILE_WORKER_ENABLED: ${SMILE_WORKER_ENABLED:-true}
      VIETQR_ENABLED: ${VIETQR_ENABLED:-false}
      VIETQR_API_BASE_URL: ${VIETQR_API_BASE_URL:-https://dev.vietqr.org}
      VIETQR_API_USERNAME: ${VIETQR_API_USERNAME:-}
      VIETQR_API_PASSWORD: ${VIETQR_API_PASSWORD:-}
      VIETQR_BANK_CODE: ${VIETQR_BANK_CODE:-MB}
      VIETQR_BANK_ACCOUNT: ${VIETQR_BANK_ACCOUNT:-}
      VIETQR_BANK_ACCOUNT_NAME: ${VIETQR_BANK_ACCOUNT_NAME:-}
      VIETQR_CALLBACK_USERNAME: ${VIETQR_CALLBACK_USERNAME:-}
      VIETQR_CALLBACK_PASSWORD: ${VIETQR_CALLBACK_PASSWORD:-}
      VIETQR_CALLBACK_JWT_SECRET: ${VIETQR_CALLBACK_JWT_SECRET:-}
      VIETQR_CALLBACK_TOKEN_EXPIRATION_SECONDS: ${VIETQR_CALLBACK_TOKEN_EXPIRATION_SECONDS:-300}
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    restart: unless-stopped
volumes:
  sqlserver_data:
